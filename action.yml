name: "AI PR Summarizer"
description: "Automatically summarize pull requests using Google Gemini AI. Generates concise summaries of code changes and posts them as PR comments."
author: "Your Name"  # Replace with your details

inputs:
  gemini_api_key:
    description: "Your Google Gemini API key (store as a secret)"
    required: true
  base_ref:
    description: "The base branch to compare changes against (e.g., 'main')"
    required: false
    default: "main"
  max_diff_size_kb:
    description: "Maximum diff size in KB to process (to avoid API limits)"
    required: false
    default: "100"
  model:
    description: "Gemini model to use (e.g., 'gemini-2.5-flash')"
    required: false
    default: "gemini-2.5-flash"
  update_comment:
    description: "Whether to update an existing summary comment instead of creating a new one"
    required: false
    default: "false"

outputs:
  summary:
    description: "The generated PR summary text"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install google-genai
      shell: bash

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract diff
      run: |
        BASE_REF="${{ inputs.base_ref }}"
        MAX_SIZE_KB="${{ inputs.max_diff_size_kb }}"
        # Fetch the target base ref for accurate diff computation
        git fetch origin "$BASE_REF":"$BASE_REF" 2>/dev/null || echo "Failed to fetch $BASE_REF, using available history"

        if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
          MERGE_BASE=$(git merge-base "$BASE_REF" HEAD 2>/dev/null || true)
          if [ -n "$MERGE_BASE" ]; then
            echo "Using merge base $MERGE_BASE for diff generation"
            git diff "$MERGE_BASE" HEAD > diff.txt
          else
            echo "No common ancestor found between $BASE_REF and HEAD; using direct diff against $BASE_REF"
            git diff "$BASE_REF" HEAD > diff.txt
          fi
        else
          echo "Base ref '$BASE_REF' not available; diffing against the previous commit"
          git diff HEAD~1 HEAD > diff.txt
        fi

        FILE_SIZE_KB=$(($(stat -c%s diff.txt) / 1024))
        if [ $FILE_SIZE_KB -gt $MAX_SIZE_KB ]; then
          head -c $(($MAX_SIZE_KB * 1024)) diff.txt > diff_truncated.txt
          mv diff_truncated.txt diff.txt
          echo -e "\n\n[Diff truncated to $MAX_SIZE_KB KB]" >> diff.txt
        fi
      shell: bash

    - name: Run summarizer
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        MODEL: ${{ inputs.model }}
      run: |
        python ${{ github.action_path }}/llm-module/main.py diff.txt > summary.txt
      shell: bash

    - name: Post or update comment
      uses: actions/github-script@v7
      env:
        UPDATE_COMMENT: ${{ inputs.update_comment }}
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.txt', 'utf8');
          const prNumber = context.payload.pull_request?.number || context.issue.number;
          const updateComment = process.env.UPDATE_COMMENT === 'true';

          if (updateComment) {
            // Find and update existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existingComment = comments.data.find(c => c.body.includes('🤖 AI Pull Request Summary'));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: summary
              });
            }
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: summary
            });
          }
          // Output the summary
          core.setOutput('summary', summary);