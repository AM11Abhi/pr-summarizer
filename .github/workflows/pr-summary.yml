name: PR Summarizer
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./  # Use local action for testing; change to your-repo@branch for others
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          base_ref: 'main'  # Optional overrides

      # 6️⃣ Show summary output
      - name: Show summary
        run: |
          echo "Generated summary:"
          cat summary.txt
      
      # 7️⃣ Post summary as PR comment
      - name: Post summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const summary = fs.readFileSync('summary.txt', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

